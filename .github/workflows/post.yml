name: LinkedIn Auto Poster

on:
  schedule:
    - cron: '0 9 * * *'  # يعمل تلقائياً يومياً الساعة 9 صباحاً
  workflow_dispatch:      # يسمح لك بتشغيل النشر يدوياً بضغطة زر للتجربة

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Auto Poster Script
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python main.py
